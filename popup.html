<!DOCTYPE html>
<html>
<head>
  <title>Prompt Expander</title>
  <link rel="stylesheet" href="popup.css"> 
</head>
<body>
  <h2>Prompt Templates by Faith Lawrence Escano</h2>
  
<div id="toggle-container">
  <input type="checkbox" id="enableToggle">
  <label for="enableToggle">Enable Prompt Expander</label>
</div>
  
  <div id="addForm">
    <h3>Add/Edit Prompt</h3>
    <div class="form-group">
      <label for="shortcut">Shortcut (must start with #):</label>
      <input type="text" id="shortcut" placeholder="#ai-persona" required>
    </div>
    <div class="form-group">
      <label for="expansion">Text:</label>
      <textarea id="expansion" rows="4" required></textarea>
    </div>
    <button id="saveButton">Save Prompt</button>
  </div>

  <div id="promptsList">
    <h3>Current Prompts</h3>
    </div>

  <script src="popup.js"></script>
</body>
</html>
